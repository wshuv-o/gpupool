# /etc/nginx/sites-available/gpu.odinbd.com
#
#   sudo ln -s /etc/nginx/sites-available/gpu.odinbd.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d gpu.odinbd.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Put this in the http{} block (or /etc/nginx/conf.d/) once, not per-site:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }

server {
    listen 80;
    listen [::]:80;
    server_name gpu.odinbd.com;
    # certbot rewrites this to a redirect once the certificate exists.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gpu.odinbd.com;

    # certbot fills these in with --nginx.
    # ssl_certificate     /etc/letsencrypt/live/gpu.odinbd.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gpu.odinbd.com/privkey.pem;

    # Matches the broker's own 16 MB default; nginx would otherwise reject a
    # large request with a 413 the broker never sees.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8787;

        # --- WebSockets -------------------------------------------------
        # Every GPU machine holds one long-lived WebSocket to the broker, and
        # tunnelled client WebSockets ride over it. Without the upgrade
        # headers those connections are refused and no machine can register.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # --- Streaming --------------------------------------------------
        # THIS IS THE ONE THAT BITES. With buffering on, nginx accumulates the
        # whole response before sending any of it, so token streaming arrives
        # as a single burst at the end. Everything still "works", which is why
        # it goes unnoticed.
        proxy_buffering off;
        proxy_cache off;
        # SSE must not be chunk-recombined either.
        gzip off;

        # --- Timeouts ---------------------------------------------------
        # Generation legitimately takes minutes, and an idle agent socket is
        # silent between heartbeats. nginx's 60s default would cut both off.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Agent sockets are long-lived by design; never time them out early.
        proxy_connect_timeout 10s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
